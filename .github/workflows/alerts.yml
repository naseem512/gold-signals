name: Signal alerts

on:
  schedule:
    - cron: '7,27,47 * * * *'   # every 20 minutes (GitHub may delay scheduled runs by a few minutes)
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test notification to every market topic'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: signal-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check markets and send ntfy alerts
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          TEST: ${{ inputs.test && '1' || '0' }}
        run: node alerts/check.js

      - name: Save alert state
        if: ${{ !inputs.test }}
        run: |
          git config user.name "naseem-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts/state.json
          if git diff --cached --quiet; then
            echo "No state change"
          else
            git commit -m "alerts: update state"
            git pull --rebase --quiet
            git push
          fi
